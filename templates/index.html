<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebrity Face Recognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }
        
        .upload-btn:hover {
            transform: scale(1.05);
        }
        
        .result-area {
            margin-top: 30px;
            text-align: center;
        }
        
        .uploaded-img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .prediction {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .confidence {
            font-size: 1.2em;
            color: #666;
        }
        
        .file-name {
            color: #667eea;
            font-weight: 500;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Celebrity Face Recognition</h1>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="upload-area" onclick="document.getElementById('file-input').click()">
                <p style="font-size: 3em; margin-bottom: 10px;">📷</p>
                <p style="color: #667eea; font-size: 1.2em;">Click to upload an image</p>
                <p style="color: #999; margin-top: 10px;">Supports: JPG, PNG</p>
                <p class="file-name" id="file-name"></p>
            </div>
            
            <input type="file" id="file-input" name="image" accept="image/*" onchange="updateFileName(this)" required>
            
            <div style="text-align: center;">
                <button type="submit" class="upload-btn">Recognize Celebrity</button>
            </div>
        </form>
        
        {% if error %}
        <div class="result-area">
            <div style="background: #fee; border: 2px solid #c33; border-radius: 10px; padding: 20px; color: #c33;">
                <p style="font-size: 1.2em; margin: 0;">{{ error }}</p>
            </div>
        </div>
        {% endif %}
        
        {% if prediction %}
        <div class="result-area">
            {% if img_path %}
            <img src="{{ img_path }}" alt="Uploaded Image" class="uploaded-img">
            {% endif %}
            
            <div class="prediction">{{ prediction }}</div>
            <div class="confidence">Confidence: {{ confidence }}%</div>
        </div>
        {% endif %}
    </div>
    
    <script>
        function updateFileName(input) {
            const fileName = input.files[0]?.name || '';
            document.getElementById('file-name').textContent = fileName ? `Selected: ${fileName}` : '';
        }
    </script>
</body>
</html>
